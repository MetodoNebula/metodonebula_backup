<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Movimiento rectilíneo uniforme en una gráfica posición tiempo</title>
  <desc id="desc">Una recta representa un ciclista que avanza a cuatro metros por segundo. Pasa de veinte metros a sesenta metros entre cero y diez segundos.</desc>
  <rect width="920" height="400" rx="24" fill="#f8fafc"/>
  <text x="460" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">MRU: misma velocidad, recta en la gráfica</text>
  <text x="460" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Un ciclista avanza 4 m cada segundo.</text>
  <g transform="translate(160 310)">
    <line x1="0" y1="0" x2="540" y2="0" stroke="#475569" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-185" stroke="#475569" stroke-width="4"/>
    <g stroke="#cbd5e1" stroke-width="2"><line x1="0" y1="-55" x2="500" y2="-55"/><line x1="0" y1="-110" x2="500" y2="-110"/><line x1="0" y1="-165" x2="500" y2="-165"/></g>
    <path d="M0 -55 L400 -165" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-55" r="9" fill="#2563eb"/><circle cx="200" cy="-110" r="9" fill="#2563eb"/><circle cx="400" cy="-165" r="9" fill="#2563eb"/>
    <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle"><text x="0" y="31">0</text><text x="200" y="31">5</text><text x="400" y="31">10</text></g>
    <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="end"><text x="-14" y="-49">20</text><text x="-14" y="-104">40</text><text x="-14" y="-159">60</text></g>
    <text x="-18" y="-193" text-anchor="end" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">posición (m)</text>
    <text x="540" y="31" text-anchor="end" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">tiempo (s)</text>
  </g>
  <rect x="625" y="150" width="190" height="78" rx="14" fill="#dbeafe"/>
  <text x="720" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d4ed8">v = 4 m/s</text>
  <text x="720" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">+20 m cada 5 s</text>
  <text x="460" y="367" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">La inclinación de la recta indica la velocidad.</text>
</svg>
