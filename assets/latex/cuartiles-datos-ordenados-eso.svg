<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Cómo localizar los cuartiles en una lista ordenada</title>
  <desc id="desc">Diez datos ordenados del cuatro al trece. La mitad inferior señala el primer cuartil seis, el centro entre ocho y nueve señala la mediana ocho coma cinco y la mitad superior señala el tercer cuartil once.</desc>
  <rect width="960" height="400" rx="24" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Cuartiles: divide los datos ordenados en cuatro partes</text>
  <text x="480" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">Ejemplo: tiempos de lectura semanal de 10 estudiantes</text>
  <text x="88" y="116" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Datos ordenados</text>
  <circle cx="270" cy="155" r="29" fill="none" stroke="#064e3b" stroke-width="3"/>
  <circle cx="690" cy="155" r="29" fill="none" stroke="#5b21b6" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <g fill="#0f766e"><circle cx="130" cy="155" r="22"/><circle cx="200" cy="155" r="22"/><circle cx="270" cy="155" r="22"/><circle cx="340" cy="155" r="22"/><circle cx="410" cy="155" r="22"/></g>
    <g fill="#7c3aed"><circle cx="550" cy="155" r="22"/><circle cx="620" cy="155" r="22"/><circle cx="690" cy="155" r="22"/><circle cx="760" cy="155" r="22"/><circle cx="830" cy="155" r="22"/></g>
    <g fill="#ffffff"><text x="130" y="162">4</text><text x="200" y="162">5</text><text x="270" y="162">6</text><text x="340" y="162">7</text><text x="410" y="162">8</text><text x="550" y="162">9</text><text x="620" y="162">10</text><text x="690" y="162">11</text><text x="760" y="162">12</text><text x="830" y="162">13</text></g>
  </g>
  <line x1="480" y1="121" x2="480" y2="187" stroke="#dc2626" stroke-width="4" stroke-dasharray="7 6"/>
  <text x="480" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b91c1c">centro entre 8 y 9</text>
  <path d="M108 202 L108 220 L432 220 L432 202" fill="none" stroke="#0f766e" stroke-width="3"/>
  <path d="M528 202 L528 220 L852 220 L852 202" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="270" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">mitad inferior → Q1 = 6</text>
  <text x="690" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7c3aed">mitad superior → Q3 = 11</text>
  <rect x="275" y="278" width="410" height="44" rx="12" fill="#fee2e2"/>
  <text x="480" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#b91c1c">Mediana = (8 + 9) ÷ 2 = 8,5</text>
  <text x="480" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">Primero ordena; después busca el centro y los centros de cada mitad.</text>
</svg>
