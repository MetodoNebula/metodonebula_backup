<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Región triangular para una integral doble</title>
  <desc id="desc">Triángulo del primer cuadrante limitado por los ejes y la recta x más y igual a uno, con cortes vertical y horizontal.</desc>
  <rect width="760" height="430" rx="20" fill="#f8fafc"/>
  <g transform="translate(110 355)">
    <line x1="0" y1="0" x2="530" y2="0" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="0" x2="0" y2="-300" stroke="#64748b" stroke-width="3"/>
    <path d="M0 0 L0 -260 L440 0 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <line x1="180" y1="0" x2="180" y2="-154" stroke="#dc2626" stroke-width="7"/>
    <line x1="0" y1="-105" x2="262" y2="-105" stroke="#0f766e" stroke-width="7"/>
    <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a">
      <text x="535" y="7">x</text><text x="-8" y="-310">y</text>
      <text x="448" y="24">1</text><text x="-25" y="-254">1</text>
      <text x="275" y="-185" fill="#2563eb">x + y = 1</text>
      <text x="190" y="-73" fill="#dc2626">corte vertical</text>
      <text x="64" y="-116" fill="#0f766e">corte horizontal</text>
    </g>
  </g>
</svg>
