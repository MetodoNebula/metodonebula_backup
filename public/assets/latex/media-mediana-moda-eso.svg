<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Media, mediana y moda en un diagrama de puntos</title>
  <desc id="desc">Catorce puntos muestran cero, una, dos o tres mascotas. El valor uno es la moda y la mediana; una línea discontinua en uno coma veintiuno muestra la media.</desc>
  <rect width="960" height="390" rx="22" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Cómo se sitúan media, mediana y moda</text>
  <text x="150" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">moda: 1 (5 puntos)</text>
  <text x="430" y="76" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">mediana: 1</text>
  <g transform="translate(135 275)">
    <line x1="0" y1="0" x2="690" y2="0" stroke="#475569" stroke-width="4"/>
    <g stroke="#64748b" stroke-width="3"><line x1="0" y1="-10" x2="0" y2="10"/><line x1="220" y1="-10" x2="220" y2="10"/><line x1="440" y1="-10" x2="440" y2="10"/><line x1="660" y1="-10" x2="660" y2="10"/></g>
    <g font-family="Arial, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle"><text x="0" y="35">0</text><text x="220" y="35">1</text><text x="440" y="35">2</text><text x="660" y="35">3</text></g>
    <line x1="266" y1="-157" x2="266" y2="23" stroke="#dc2626" stroke-width="4" stroke-dasharray="9 7"/>
    <text x="266" y="-174" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">media = 1,21</text>
    <g fill="#0f766e"><circle cx="0" cy="-28" r="13"/><circle cx="0" cy="-61" r="13"/><circle cx="0" cy="-94" r="13"/><circle cx="0" cy="-127" r="13"/></g>
    <g fill="#2563eb"><circle cx="220" cy="-28" r="13"/><circle cx="220" cy="-61" r="13"/><circle cx="220" cy="-94" r="13"/><circle cx="220" cy="-127" r="13"/><circle cx="220" cy="-160" r="13"/></g>
    <g fill="#7c3aed"><circle cx="440" cy="-28" r="13"/><circle cx="440" cy="-61" r="13"/><circle cx="440" cy="-94" r="13"/></g>
    <g fill="#ea580c"><circle cx="660" cy="-28" r="13"/><circle cx="660" cy="-61" r="13"/></g>
  </g>
  <text x="480" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">Cada punto representa a un estudiante; los datos están ordenados por número de mascotas.</text>
</svg>
