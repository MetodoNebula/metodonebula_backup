<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Media, mediana y moda en los datos de mascotas</title>
  <desc id="desc">Una fila ordenada de catorce datos muestra que las posiciones siete y ocho son uno, por lo que la mediana es uno. Cinco unos convierten al uno en la moda. Una recta numérica marca la media en 1,21.</desc>
  <rect width="960" height="470" rx="24" fill="#f8fafc"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Media, mediana y moda: tres formas de resumir los datos</text>
  <text x="85" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Datos ordenados (14 estudiantes)</text>
  <g font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <g fill="#0f766e"><circle cx="125" cy="118" r="18"/><circle cx="172" cy="118" r="18"/><circle cx="219" cy="118" r="18"/><circle cx="266" cy="118" r="18"/></g>
    <g fill="#2563eb"><circle cx="313" cy="118" r="18"/><circle cx="360" cy="118" r="18"/><circle cx="407" cy="118" r="18"/><circle cx="454" cy="118" r="18"/><circle cx="501" cy="118" r="18"/></g>
    <g fill="#7c3aed"><circle cx="548" cy="118" r="18"/><circle cx="595" cy="118" r="18"/><circle cx="642" cy="118" r="18"/></g>
    <g fill="#ea580c"><circle cx="689" cy="118" r="18"/><circle cx="736" cy="118" r="18"/></g>
    <g fill="#ffffff"><text x="125" y="124">0</text><text x="172" y="124">0</text><text x="219" y="124">0</text><text x="266" y="124">0</text><text x="313" y="124">1</text><text x="360" y="124">1</text><text x="407" y="124">1</text><text x="454" y="124">1</text><text x="501" y="124">1</text><text x="548" y="124">2</text><text x="595" y="124">2</text><text x="642" y="124">2</text><text x="689" y="124">3</text><text x="736" y="124">3</text></g>
  </g>
  <path d="M388 151 L388 166 L473 166 L473 151" fill="none" stroke="#0f172a" stroke-width="3"/>
  <text x="430" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">posiciones 7 y 8</text>
  <text x="430" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#475569">(1 y 1) → mediana = 1</text>
  <g transform="translate(132 335)">
    <line x1="0" y1="0" x2="670" y2="0" stroke="#475569" stroke-width="4"/>
    <g stroke="#64748b" stroke-width="3"><line x1="0" y1="-10" x2="0" y2="10"/><line x1="213" y1="-10" x2="213" y2="10"/><line x1="426" y1="-10" x2="426" y2="10"/><line x1="639" y1="-10" x2="639" y2="10"/></g>
    <g font-family="Arial, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle"><text x="0" y="34">0</text><text x="213" y="34">1</text><text x="426" y="34">2</text><text x="639" y="34">3</text></g>
    <rect x="182" y="-35" width="62" height="35" rx="8" fill="#dbeafe"/>
    <line x1="258" y1="-84" x2="258" y2="26" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="258" y="-99" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">media = 1,21</text>
    <text x="213" y="-15" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">moda = 1</text>
  </g>
  <g font-family="Arial, sans-serif"><rect x="78" y="391" width="252" height="50" rx="12" fill="#dbeafe"/><text x="99" y="413" font-size="16" font-weight="700" fill="#1d4ed8">MODA</text><text x="99" y="432" font-size="15" fill="#334155">El valor que más se repite: 1.</text><rect x="354" y="391" width="252" height="50" rx="12" fill="#e2e8f0"/><text x="375" y="413" font-size="16" font-weight="700" fill="#0f172a">MEDIANA</text><text x="375" y="432" font-size="15" fill="#334155">El centro de los datos ordenados: 1.</text><rect x="630" y="391" width="252" height="50" rx="12" fill="#fee2e2"/><text x="651" y="413" font-size="16" font-weight="700" fill="#b91c1c">MEDIA</text><text x="651" y="432" font-size="15" fill="#334155">El reparto equilibrado: 1,21.</text></g>
</svg>
