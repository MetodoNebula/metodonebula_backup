<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Área entre una parábola y una recta</title>
  <desc id="desc">La región sombreada está limitada arriba por la recta y igual a x más 2, abajo por la parábola y igual a x al cuadrado, y por sus intersecciones x igual a menos 1 y x igual a 2.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M80 40V360M180 40V360M280 40V360M380 40V360M480 40V360M580 40V360"/>
    <path d="M60 40H660M60 100H660M60 160H660M60 220H660M60 280H660M60 340H660"/>
  </g>
  <path d="M180 280 L480 100 L460 146 L440 186 L420 222 L400 254 L380 280 L360 302 L340 318 L320 330 L300 338 L280 340 L260 338 L240 330 L220 318 L200 302 Z" fill="#a78bfa" fill-opacity="0.32" stroke="none"/>
  <g stroke="#334155" stroke-width="2">
    <path d="M60 340H665"/>
    <path d="M280 365V35"/>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="16">
    <text x="666" y="335">x</text>
    <text x="288" y="50">y</text>
    <text x="170" y="365">−1</text>
    <text x="474" y="365">2</text>
  </g>
  <path d="M80 340 L580 40" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 146 L120 186 L140 222 L160 254 L180 280 L200 302 L220 318 L240 330 L260 338 L280 340 L300 338 L320 330 L340 318 L360 302 L380 280 L400 254 L420 222 L440 186 L460 146 L480 100 L500 50" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="18" font-weight="600">
    <text x="515" y="82" fill="#2563eb">y = x + 2</text>
    <text x="505" y="125" fill="#dc2626">y = x²</text>
    <text x="250" y="190" fill="#6d28d9">superior − inferior</text>
  </g>
  <g fill="#111827">
    <circle cx="180" cy="280" r="5"/>
    <circle cx="480" cy="100" r="5"/>
  </g>
</svg>
