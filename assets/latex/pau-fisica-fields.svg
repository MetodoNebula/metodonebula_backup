<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">Esquemas de líneas de campo y campo magnético alrededor de un hilo</title><desc id="desc">A la izquierda líneas de campo eléctrico de cargas positiva y negativa; a la derecha el sentido circular del campo magnético de un conductor.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#2563eb"/></marker></defs><rect width="900" height="330" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="225" y="34" font-size="23" text-anchor="middle" font-weight="700">Campo eléctrico</text><circle cx="150" cy="175" r="24" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="142" y="184" font-size="30" fill="#dc2626">+</text><circle cx="300" cy="175" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="293" y="184" font-size="30" fill="#2563eb">−</text><path d="M174 160 C210 105 240 105 276 160 M174 190 C210 245 240 245 276 190 M177 175 L274 175" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="225" y="290" font-size="18" text-anchor="middle">Las líneas salen de + y entran en −</text><text x="675" y="34" font-size="23" text-anchor="middle" font-weight="700">Campo de un hilo rectilíneo</text><circle cx="675" cy="165" r="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><circle cx="675" cy="165" r="3" fill="#0f172a"/><text x="695" y="172" font-size="19">I saliente</text><circle cx="675" cy="165" r="55" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="675" cy="165" r="100" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M675 65 A100 100 0 0 1 770 135" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><path d="M675 110 A55 55 0 0 1 728 150" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="675" y="290" font-size="18" text-anchor="middle">Regla de la mano derecha</text></g></svg>
