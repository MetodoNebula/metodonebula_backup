<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Recta tangente a una circunferencia</title>
  <desc id="desc">Circunferencia de radio cinco, punto tres coma cuatro, radio y recta tangente perpendicular.</desc>
  <rect width="720" height="420" rx="20" fill="#f8fafc"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="75" y1="270" x2="645" y2="270"/>
    <line x1="360" y1="38" x2="360" y2="382"/>
  </g>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="16">
    <text x="650" y="276">x</text>
    <text x="367" y="35">y</text>
    <text x="346" y="291">O</text>
  </g>
  <circle cx="360" cy="270" r="150" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-width="5"/>
  <line x1="360" y1="270" x2="450" y2="150" stroke="#0f766e" stroke-width="4"/>
  <line x1="330" y1="70" x2="540" y2="227.5" stroke="#dc2626" stroke-width="5"/>
  <circle cx="450" cy="150" r="7" fill="#111827"/>
  <path d="M437 167 L454 180 L467 163" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a">
    <text x="463" y="141">P(3, 4)</text>
    <text x="476" y="103" fill="#dc2626">3x + 4y = 25</text>
    <text x="235" y="355" fill="#2563eb">x² + y² = 25</text>
    <text x="374" y="215" fill="#0f766e">radio</text>
  </g>
</svg>
