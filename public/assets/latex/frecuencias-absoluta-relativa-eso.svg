<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Frecuencia absoluta y relativa del número de mascotas</title>
  <desc id="desc">Un gráfico de barras de catorce estudiantes. Para cero, una, dos y tres mascotas, las frecuencias absolutas son cuatro, cinco, tres y dos; sus frecuencias relativas son 28,6, 35,7, 21,4 y 14,3 por ciento.</desc>
  <rect width="920" height="480" rx="24" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#0f172a">Frecuencias: número de mascotas de 14 estudiantes</text>
  <text x="460" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">La altura es la frecuencia absoluta; el porcentaje es la frecuencia relativa.</text>
  <rect x="285" y="84" width="350" height="32" rx="16" fill="#dbeafe"/>
  <text x="460" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">frecuencia relativa = frecuencia absoluta ÷ 14</text>
  <g transform="translate(112 385)">
    <g stroke="#cbd5e1" stroke-width="2"><line x1="0" y1="0" x2="690" y2="0"/><line x1="0" y1="-48" x2="690" y2="-48"/><line x1="0" y1="-96" x2="690" y2="-96"/><line x1="0" y1="-144" x2="690" y2="-144"/><line x1="0" y1="-192" x2="690" y2="-192"/><line x1="0" y1="-240" x2="690" y2="-240"/></g>
    <g stroke="#475569" stroke-width="3"><line x1="0" y1="0" x2="710" y2="0"/><line x1="0" y1="0" x2="0" y2="-260"/></g>
    <g font-family="Arial, sans-serif" font-size="16" fill="#334155" text-anchor="end"><text x="-12" y="6">0</text><text x="-12" y="-42">1</text><text x="-12" y="-90">2</text><text x="-12" y="-138">3</text><text x="-12" y="-186">4</text><text x="-12" y="-234">5</text></g>
    <rect x="74" y="-192" width="102" height="192" rx="10" fill="#60a5fa"/><rect x="240" y="-240" width="102" height="240" rx="10" fill="#2563eb"/><rect x="406" y="-144" width="102" height="144" rx="10" fill="#60a5fa"/><rect x="572" y="-96" width="102" height="96" rx="10" fill="#60a5fa"/>
    <g font-family="Arial, sans-serif" text-anchor="middle"><text x="125" y="-207" font-size="21" font-weight="700" fill="#0f172a">4</text><text x="125" y="-186" font-size="15" font-weight="700" fill="#0f172a">28,6 %</text><text x="291" y="-255" font-size="21" font-weight="700" fill="#0f172a">5</text><text x="291" y="-234" font-size="15" font-weight="700" fill="#0f172a">35,7 %</text><text x="457" y="-159" font-size="21" font-weight="700" fill="#0f172a">3</text><text x="457" y="-138" font-size="15" font-weight="700" fill="#0f172a">21,4 %</text><text x="623" y="-111" font-size="21" font-weight="700" fill="#0f172a">2</text><text x="623" y="-90" font-size="15" font-weight="700" fill="#0f172a">14,3 %</text><text x="125" y="30" font-size="18" fill="#0f172a">0 mascotas</text><text x="291" y="30" font-size="18" fill="#0f172a">1 mascota</text><text x="457" y="30" font-size="18" fill="#0f172a">2 mascotas</text><text x="623" y="30" font-size="18" fill="#0f172a">3 mascotas</text></g>
  </g>
  <text x="32" y="260" transform="rotate(-90 32 260)" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Frecuencia absoluta (alumnos)</text>
  <rect x="243" y="433" width="434" height="30" rx="15" fill="#e2e8f0"/>
  <text x="460" y="454" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">4 + 5 + 3 + 2 = 14 alumnos · 28,6 + 35,7 + 21,4 + 14,3 = 100 %</text>
</svg>
