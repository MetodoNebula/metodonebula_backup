<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Ley de gravitación universal entre la Tierra y un objeto</title>
  <desc id="desc">Un esquema sobrio muestra la Tierra y un objeto que se atraen. Una fórmula en forma de fracción expresa que la fuerza es el producto de G, M y m dividido entre la distancia al cuadrado.</desc>
  <rect width="920" height="400" rx="24" fill="#f8fafc"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">La gravedad atrae a cualquier par de masas</text>
  <rect x="300" y="66" width="320" height="70" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="362" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#4c1d95">F =</text>
  <text x="503" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4c1d95">G · M · m</text>
  <line x1="420" y1="103" x2="586" y2="103" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="503" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4c1d95">r²</text>
  <circle cx="260" cy="232" r="68" fill="#2563eb"/>
  <path d="M214 208 Q260 185 306 208 M214 251 Q260 274 306 251" fill="none" stroke="#93c5fd" stroke-width="7" stroke-linecap="round"/>
  <text x="260" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Tierra</text>
  <text x="260" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">masa M</text>
  <circle cx="660" cy="232" r="31" fill="#f59e0b"/>
  <text x="660" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">m</text>
  <line x1="328" y1="232" x2="629" y2="232" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 7"/>
  <rect x="430" y="211" width="60" height="30" rx="15" fill="#f8fafc"/>
  <text x="460" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#475569">r</text>
  <path d="M364 285 L424 285 L409 270 M424 285 L409 300" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M556 285 L496 285 L511 270 M496 285 L511 300" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="460" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#4c1d95">Se atraen con fuerzas iguales y opuestas.</text>
  <rect x="190" y="345" width="540" height="30" rx="15" fill="#eef2ff"/>
  <text x="460" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Más masa → más fuerza · Más distancia → menos fuerza</text>
</svg>
