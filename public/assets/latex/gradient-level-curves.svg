<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Gradiente y curvas de nivel</title>
  <desc id="desc">Curvas de nivel elípticas y un vector gradiente perpendicular a la curva en un punto.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="720" height="420" rx="20" fill="#f8fafc"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="85" y1="220" x2="635" y2="220"/>
    <line x1="330" y1="45" x2="330" y2="375"/>
  </g>
  <g fill="none" stroke="#2563eb">
    <ellipse cx="330" cy="220" rx="70" ry="43" stroke-width="3" opacity="0.55"/>
    <ellipse cx="330" cy="220" rx="135" ry="83" stroke-width="4" opacity="0.75"/>
    <ellipse cx="330" cy="220" rx="205" ry="126" stroke-width="5"/>
  </g>
  <circle cx="438" cy="170" r="7" fill="#111827"/>
  <line x1="438" y1="170" x2="548" y2="68" stroke="#dc2626" stroke-width="6" marker-end="url(#arrow)"/>
  <line x1="384" y1="54" x2="492" y2="286" stroke="#0f766e" stroke-width="4" stroke-dasharray="10 8"/>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a">
    <text x="445" y="192">P</text>
    <text x="540" y="58" fill="#dc2626">∇f(P)</text>
    <text x="498" y="294" fill="#0f766e">tangente</text>
    <text x="128" y="368" fill="#2563eb">f(x, y) = c</text>
    <text x="642" y="226" fill="#64748b">x</text>
    <text x="338" y="43" fill="#64748b">y</text>
  </g>
</svg>
